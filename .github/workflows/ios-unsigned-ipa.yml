# Compile un IPA NON SIGNE sur un Mac fourni gratuitement par GitHub.
#
# Pourquoi : Apple exige un Mac pour compiler une app iOS, et un compte
# developpeur payant pour la signer. Ici on compile sans signer ; c'est
# Sideloadly (ou AltStore) qui signera ensuite sur ton PC avec ton
# Apple ID gratuit. Voir docs/SETUP-IOS.md.
#
# Lancement : onglet "Actions" du depot -> "IPA iOS (non signe)" ->
# "Run workflow". L'IPA se telecharge en bas de la page du run.

name: IPA iOS (non signe)

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: "URL du serveur relais (ex. https://mon-relais.trycloudflare.com)"
        required: true
      display_name:
        description: "Nom affiche a tes contacts"
        required: false
        default: "Kevin"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Exige par le podspec officiel de Signal pour telecharger le
      # binaire libsignal precompile. Doit correspondre a la version
      # epinglee dans plugins/withLibsignalPod.js (v0.99.1).
      LIBSIGNAL_FFI_PREBUILD_CHECKSUM: c7b1ad515b0698497f051cb7a65e0d9a6e1e5d707db82aa334fa8c834e3e4fd8
      EXPO_PUBLIC_RELAY_URL: ${{ inputs.relay_url }}
      EXPO_PUBLIC_DISPLAY_NAME: ${{ inputs.display_name }}

    steps:
      # expo-modules-jsi expose un paquet Swift en swift-tools-version 6.2 :
      # un Xcode trop ancien echoue sur "Could not resolve package
      # dependencies". On prend donc systematiquement le plus recent installe.
      - name: Selectionner le Xcode le plus recent
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          {
            echo "### Environnement de compilation"
            echo '```'
            xcodebuild -version
            swift --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dependances de l'app
        working-directory: app
        run: npm ci

      # Deux tests lancent le VRAI serveur relais en sous-processus :
      # il lui faut ses propres dependances, sinon ils echouent.
      - name: Installer les dependances du relais
        working-directory: relay-server
        run: npm ci

      - name: Verifier que les tests passent
        working-directory: app
        run: npm test -- --forceExit

      - name: Generer le projet Xcode
        working-directory: app
        run: npx expo prebuild --platform ios --no-install

      - name: Installer les pods (dont LibSignalClient)
        working-directory: app/ios
        run: pod install

      - name: Verifier que le projet Xcode existe
        working-directory: app
        run: |
          set -euo pipefail
          test -d ios || { echo "::error::le dossier ios/ n'a pas ete genere"; exit 1; }
          test -f ios/Blackout.xcworkspace/contents.xcworkspacedata \
            || { echo "::error::workspace absent — pod install a echoue"; ls -la ios; exit 1; }
          echo "Schemes disponibles :"
          xcodebuild -workspace ios/Blackout.xcworkspace -list

      - name: Compiler SANS signature
        working-directory: app/ios
        # `set -o pipefail` est INDISPENSABLE : sans lui, le code de sortie
        # est celui de `tee`, et un echec de Xcode passerait pour un succes.
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Blackout.xcworkspace \
            -scheme Blackout \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Publier les erreurs de compilation dans le resume
        if: always()
        working-directory: app/ios
        run: |
          {
            echo "### Sortie de xcodebuild"
            if [ ! -f xcodebuild.log ]; then
              echo "aucun journal — xcodebuild n'a pas demarre"
            else
              echo "#### Erreurs (avec contexte)"
              echo '```'
              grep -n -E "error:|BUILD FAILED" -A 12 xcodebuild.log | head -100 || echo "(aucune ligne 'error:')"
              echo '```'
              echo "#### 60 dernieres lignes"
              echo '```'
              tail -60 xcodebuild.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Empaqueter en .ipa
        working-directory: app/ios
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Blackout.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Blackout.app introuvable — la compilation a echoue"
            ls -R build/Build/Products || true
            exit 1
          fi
          # Une app iOS reelle pese des dizaines de Mo : un bundle quasi vide
          # signifie que Xcode a echoue sans le dire.
          SIZE_KB=$(du -sk "$APP_PATH" | cut -f1)
          echo "Taille du bundle : ${SIZE_KB} Ko"
          if [ "$SIZE_KB" -lt 2000 ]; then
            echo "::error::bundle suspect (${SIZE_KB} Ko) — compilation incomplete"
            find "$APP_PATH" | head -30
            exit 1
          fi
          test -f "$APP_PATH/Blackout" || { echo "::error::binaire executable absent"; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Blackout-unsigned.ipa Payload
          echo "IPA produit : $(du -h Blackout-unsigned.ipa | cut -f1)"
          echo "IPA : $(du -h Blackout-unsigned.ipa | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Blackout-unsigned-ipa
          path: app/ios/Blackout-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Journal complet de compilation (pour diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/ios/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
